name: Sync Daily Digest From Gemini

on:
  schedule:
    # 每天东八区早上 07:10 (对应 UTC 23:10) 自动触发
    - cron: '10 23 * * *'
  workflow_dispatch: # 支持在 GitHub 页面随时手动点按钮立即测试

permissions:
  contents: write # 授予自动提交代码的读写权限

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest index.html from Google Drive
        run: |
          echo "Downloading latest HTML generated by Gemini Spark..."
          curl -sL "https://drive.usercontent.google.com/download?id=1jGczJz0G-YQzuF-ebrGtviVJCXbE_H9-&export=download&confirm=t" -o index.html
          
          # 验证文件是否成功下载
          if [ ! -s index.html ]; then
            echo "Error: Downloaded file is empty. Please ensure the Google Drive file is set to 'Anyone with the link'."
            exit 1
          fi
          echo "Download successful! File preview:"
          head -n 10 index.html

      - name: Commit and push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          
          # 核心：获取东八区（Asia/Shanghai / UTC+8）的精确时分秒
          TIMESTAMP=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')
          
          # 如果文件有变动则提交并推送（带东八区精确时间）
          git diff --staged --quiet || (git commit -m "Auto-sync daily digest from Gemini Spark [$TIMESTAMP UTC+8]" && git push)
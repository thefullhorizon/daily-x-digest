name: Sync Daily Data From Gemini

on:
  schedule:
    # 每天东八区早上 07:10 (UTC 23:10) 自动触发
    - cron: '10 23 * * *'
  workflow_dispatch: # 支持随时手动一键测试

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch data.json from Google Doc
        run: |
          echo "Fetching latest daily data from permanent Google Doc..."
          curl -sL "https://docs.google.com/document/d/1Fqg0zcxKAebVj8juvk_20Hx9RHe4SmJpLww2iZep_8g/export?format=txt" -o raw.txt
          
          # 提取纯净合法的 JSON
          python3 -c "
          import json, re, sys
          with open('raw.txt', 'r', encoding='utf-8') as f:
              text = f.read()
          match = re.search(r'\{.*\}', text, re.DOTALL)
          if not match:
              print('Error: Valid JSON not found. Please ensure the Google Doc is shared as public.')
              sys.exit(1)
          raw_json = match.group(0).replace('\\_', '_').replace('\\[', '[').replace('\\]', ']')
          data = json.loads(raw_json)
          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(f'Successfully generated data.json! Date: {data.get(\"date\")}, Items: {len(data.get(\"items\", []))}')
          "

      - name: Commit and push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          TIMESTAMP=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')
          git diff --staged --quiet || (git commit -m "Auto-sync daily data from Gemini Spark [$TIMESTAMP UTC+8]" && git push)
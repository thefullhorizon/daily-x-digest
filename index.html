<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X 科技与金融前沿情报 · 晨报</title>
  <style>
    :root {
      --bg-base: #0a0d14;
      --bg-surface: #111726;
      --bg-card: #161f33;
      --bg-card-hover: #1c2742;
      --border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --ai-color: #8b5cf6;
      --embodied-color: #06b6d4;
      --finance-color: #10b981;
      --vc-color: #f43f5e;
      --gold: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.6;
      padding: 32px 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      background: linear-gradient(135deg, #161f36 0%, #0d121f 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      margin-bottom: 12px;
    }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
    .subtitle { color: var(--text-muted); font-size: 14px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }
    .stat-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .stat-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; font-weight: 600; }
    .stat-value { font-size: 24px; font-weight: 700; color: var(--text-main); margin-top: 4px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      align-items: center;
      justify-content: space-between;
    }
    .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }
    .feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(540px, 1fr));
      gap: 20px;
    }
    @media (max-width: 640px) {
      .feed-grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
      background: var(--bg-card-hover);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .card-category {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .cat-ai { background: rgba(139, 92, 246, 0.15); color: var(--ai-color); border: 1px solid rgba(139, 92, 246, 0.3); }
    .cat-robot { background: rgba(6, 182, 212, 0.15); color: var(--embodied-color); border: 1px solid rgba(6, 182, 212, 0.3); }
    .cat-finance { background: rgba(16, 185, 129, 0.15); color: var(--finance-color); border: 1px solid rgba(16, 185, 129, 0.3); }
    .cat-vc { background: rgba(244, 63, 94, 0.15); color: var(--vc-color); border: 1px solid rgba(244, 63, 94, 0.3); }
    .score-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .score-badge.s-tier {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(245, 158, 11, 0.2));
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }
    .tag {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .card-body {
      font-size: 14px;
      color: #d1d5db;
      margin-bottom: 20px;
    }
    .card-body ul {
      padding-left: 18px;
      margin: 8px 0;
    }
    .card-body li {
      margin-bottom: 6px;
    }
    .card-body li strong {
      color: #ffffff;
    }
    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-dim);
    }
    .source-link {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .source-link:hover { text-decoration: underline; color: #a5b4fc; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">⚡ 每日 07:00 自动研报 · X 监控专线</div>
      <h1 id="header-title">X 科技与金融前沿情报 · 晨报</h1>
      <div class="subtitle" id="header-subtitle">正在同步最新数据...</div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label">总监控条目</div>
          <div class="stat-value" id="stat-total">--</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">S 级核心事件</div>
          <div class="stat-value" id="stat-s" style="color: #f87171;">--</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">A 级关键突破</div>
          <div class="stat-value" id="stat-a" style="color: #60a5fa;">--</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">平均重要性</div>
          <div class="stat-value" id="stat-avg" style="color: #fbbf24;">--</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="filterCategory('all')">全部赛道</button>
        <button class="tab-btn" onclick="filterCategory('ai')">🤖 人工智能</button>
        <button class="tab-btn" onclick="filterCategory('robot')">🦾 具身智能</button>
        <button class="tab-btn" onclick="filterCategory('finance')">📈 金融股市</button>
        <button class="tab-btn" onclick="filterCategory('vc')">💼 顶级 VC</button>
      </div>
    </div>

    <div class="feed-grid" id="feed-grid">
      <div style="color: var(--text-muted); padding: 20px;">数据加载中...</div>
    </div>
  </div>

  <script>
    // 异步加载纯数据 JSON 并渲染
    async function loadDigest() {
      try {
        const res = await fetch('./data.json?t=' + new Date().getTime());
        if (!res.ok) throw new Error("HTTP error " + res.status);
        const data = await res.json();

        // 渲染顶部数据
        document.getElementById('header-subtitle').textContent = 
          `采集窗口：${data.date} (${data.timezone || 'UTC+8'}) · 覆盖 AI 前沿、具身智能、金融宏观与顶级风险投资基金`;
        document.getElementById('stat-total').textContent = `${data.stats.total} 篇精选`;
        document.getElementById('stat-s').textContent = `${data.stats.s_tier} 项`;
        document.getElementById('stat-a').textContent = `${data.stats.a_tier} 项`;
        document.getElementById('stat-avg').textContent = `${data.stats.avg_score} / 10`;

        // 渲染卡片列表
        const grid = document.getElementById('feed-grid');
        grid.innerHTML = data.items.map(item => `
          <div class="card" data-category="${item.category}">
            <div>
              <div class="card-top">
                <span class="card-category ${item.category_class || 'cat-ai'}">${item.category_name}</span>
                <span class="score-badge ${item.score >= 9.0 ? 's-tier' : ''}">★ ${item.score} · ${item.tier}</span>
              </div>
              <h2 class="card-title">${item.title}</h2>
              <div class="tags">
                ${item.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
              </div>
              <div class="card-body">
                <ul>
                  ${item.bullets.map(b => `<li>${b}</li>`).join('')}
                </ul>
              </div>
            </div>
            <div class="card-footer">
              <span>信源：${item.source_title}</span>
              <a class="source-link" href="${item.source_url}" target="_blank">查看报道 →</a>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("加载数据失败:", err);
        document.getElementById('feed-grid').innerHTML = 
          `<div style="color: #f87171; padding: 20px;">数据加载失败，请检查 data.json 是否存在。</div>`;
      }
    }

    function filterCategory(cat) {
      const cards = document.querySelectorAll('.card');
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      cards.forEach(card => {
        if (cat === 'all' || card.getAttribute('data-category') === cat) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    loadDigest();
  </script>
</body>
</html>
